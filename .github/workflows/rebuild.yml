name: Scheduled rebuild

# Airtable's attachment URLs expire after roughly two hours, and they get baked
# into the HTML at build time, so the site needs a periodic rebuild or every
# photo eventually 404s. Every 30 minutes leaves room for GitHub's scheduled
# runs to be late or skipped.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
